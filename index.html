<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #fbf7ef;
    color: #2c2c2a;
    padding: 20px 16px 44px;
    line-height: 1.5;
  }
  .wrap { max-width: 460px; margin: 0 auto; }
  .head { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .ava { width: 58px; height: 58px; border-radius: 50%; object-fit: cover; object-position: 50% 18%; border: 3px solid #ffd02f; background: #faeeda; flex: 0 0 auto; }
  .head .who { font-size: 15px; font-weight: 600; }
  .head .who small { display: block; font-size: 12px; color: #888780; font-weight: 400; margin-top: 2px; }
  h1 { font-size: 25px; line-height: 1.25; margin-bottom: 6px; }
  h1 .hl { background: linear-gradient(transparent 60%, #ffd02f 60%); padding: 0 4px; }
  .sub { font-size: 13px; color: #5f5e5a; margin-bottom: 18px; }
  .card { background: #fff; border-radius: 16px; padding: 18px 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.05); }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .field label .hint { font-weight: 400; color: #9b9890; font-size: 12px; }
  .field input, .field select {
    width: 100%; font-size: 16px; padding: 11px 12px;
    border: 1.5px solid #e7e2d6; border-radius: 10px; background: #fdfbf6; color: #2c2c2a;
    outline: none; -webkit-appearance: none; appearance: none;
  }
  .field input:focus, .field select:focus { border-color: #ffd02f; background: #fff; }
  .row { display: flex; gap: 10px; }
  .row .field { flex: 1; }
  .btn {
    width: 100%; margin-top: 6px; background: #2c2c2a; color: #fff;
    font-size: 17px; font-weight: 600; padding: 15px; border: none; border-radius: 40px; cursor: pointer;
    letter-spacing: 1px;
  }
  .btn:active { transform: scale(0.99); }
  .result { display: none; margin-top: 16px; }
  .result.show { display: block; }
  .rbox { background: #2c2c2a; color: #fff; border-radius: 14px; padding: 18px 16px; }
  .rbox .big { font-size: 15px; color: #d3d1c7; }
  .rbox .num { font-size: 34px; font-weight: 700; color: #ffd02f; margin: 4px 0 2px; }
  .rbox .num.neg { color: #97C459; }
  .rline { display: flex; justify-content: space-between; font-size: 13px; padding: 6px 0; border-top: 1px solid rgba(255,255,255,0.14); margin-top: 10px; }
  .rline span:last-child { color: #ffd02f; font-weight: 600; }
  .advice { font-size: 13px; color: #5f5e5a; background: #faeeda; border-radius: 10px; padding: 12px 14px; margin-top: 12px; }
  .bar { height: 10px; border-radius: 6px; background: #eee; overflow: hidden; margin-top: 12px; }
  .bar i { display: block; height: 100%; background: #ffd02f; width: 0; transition: width .5s; }
  .cta { margin-top: 18px; text-align: center; background: #fff; border: 1.5px dashed #ffd02f; border-radius: 14px; padding: 16px; }
  .cta b { font-size: 15px; }
  .cta p { font-size: 12.5px; color: #888780; margin-top: 4px; }
  .foot { font-size: 11.5px; color: #a9a69d; text-align: center; margin-top: 20px; line-height: 1.6; }
</style>

    <div class="foot" data-page-node-id="fnx13jB3GEb86653t1g3Nz">
      本测算为保险养老科普示意，采用简化公式，实际养老金以当地人社部门核定为准；<br data-page-node-id="tVDz2BxS6Lc6ssOCcaS1yA">不构成投保建议或收益承诺。

<script>
function num(id){ var v = parseFloat(document.getElementById(id).value); return isNaN(v) ? 0 : v; }
function fmt(v){ return '¥' + Math.round(v).toLocaleString('zh-CN'); }
function monthsOf(age){
  if (age <= 50) return 195;
  if (age >= 65) return 101;
  var table = {50:195,55:170,60:139,65:101};
  var ks = [50,55,60,65];
  for (var i=0;i<ks.length-1;i++){
    if (age >= ks[i] && age <= ks[i+1]){
      var r = (age - ks[i]) / (ks[i+1] - ks[i]);
      return Math.round(table[ks[i]] + (table[ks[i+1]] - table[ks[i]]) * r);
    }
  }
  return 139;
}
function calc(){
  var age = num('age'), rAge = num('retireAge'), social = num('social');
  var base = num('base'), years = num('years'), need = num('need'), other = num('other');
  if (!age || !rAge || !social || !base || !need){
    alert('请把带「如」的必填项填一下：年龄、退休年龄、社平工资、缴费基数、期望开支。');
    return;
  }
  if (rAge <= age){ alert('预计退休年龄要大于当前年龄哦。'); return; }
  var projYears = years + (rAge - age);
  if (projYears > 45) projYears = 45;
  var idx = base / social;
  if (idx < 0.6) idx = 0.6; if (idx > 3) idx = 3;
  var basic = social * (1 + idx) / 2 * projYears * 0.01;
  var acct = base * 0.08 * 12 * projYears;
  var months = monthsOf(rAge);
  var acctPension = acct / months;
  var pension = basic + acctPension;
  var gap = need - pension - other;

  document.getElementById('pension').textContent = fmt(pension);
  document.getElementById('needOut').textContent = fmt(need);
  document.getElementById('otherOut').textContent = fmt(other);

  var g = document.getElementById('gapNum');
  var note = document.getElementById('gapNote');
  var advice = document.getElementById('advice');
  var bar = document.getElementById('bar');
  var cover = Math.min(100, Math.round((pension + other) / need * 100));
  bar.style.width = cover + '%';

  if (gap > 0){
    g.textContent = fmt(gap);
    g.className = 'num';
    note.textContent = '预计每月缺口（按 ' + rAge + ' 岁退休、缴满约 ' + Math.round(projYears) + ' 年估算）';
    advice.innerHTML = '你的养老金大致能覆盖退休开支的 <b>' + cover + '%</b>。缺口部分，可以早点用商业年金或个人养老金账户慢慢补——具体配多少、怎么配，因人而异，得看你的情况。';
  } else {
    g.textContent = '基本覆盖 ✓';
    g.className = 'num neg';
    g.style.fontSize = '26px';
    note.textContent = '按当前假设，退休后现金流基本够用';
    advice.innerHTML = '你目前的养老现金流大致能覆盖开支（覆盖率约 <b>' + cover + '%</b>）。建议做好通胀和医疗支出的预留，别让「够用」变成「勉强」。';
  }
  document.getElementById('result').classList.add('show');
  document.getElementById('result').scrollIntoView({behavior:'smooth', block:'start'});
}
</script>
